<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">
<style>.t{fill:#24292f}.m{fill:#57606a}.pass{fill:#1a7f37}.fail{fill:#afb8c1}.ax{stroke:#d0d7de}@media (prefers-color-scheme:dark){.t{fill:#e6edf3}.m{fill:#9198a1}.pass{fill:#3fb950}.fail{fill:#484f58}.ax{stroke:#30363d}}</style>
<text class="t" x="0" y="20" font-weight="600" font-size="15">site-shift-meter: eval AUROC by method (n=180, gate = control + 0.08)</text>
